<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>历史成长 - AI面镜</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: { indigo: { DEFAULT: '#6366F1' }, brandgreen: '#10B981', brandorange: '#F59E0B' },
      fontFamily: { sans: ['Inter','PingFang SC','Microsoft YaHei','sans-serif'] },
      boxShadow: { soft:'0 4px 20px rgba(99,102,241,0.08)', softlg:'0 10px 40px rgba(99,102,241,0.15)' },
    }}};
  </script>
  <style>
    body { background: #F9FAFB; color: #111827; }
    .gradient-btn { background: linear-gradient(135deg,#6366F1 0%,#8B5CF6 100%); transition: all .25s ease; }
    .gradient-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(99,102,241,0.4); }
    .gradient-text { background: linear-gradient(135deg,#6366F1 0%,#8B5CF6 100%); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  </style>
</head>
<body class="font-sans antialiased">

  <nav class="bg-white border-b border-gray-100 sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-xl gradient-btn flex items-center justify-center text-white text-lg">🪞</div>
        <span class="text-xl font-bold">AI面镜</span>
      </a>
      <div class="flex items-center gap-4 text-sm">
        <a href="历史成长.html" class="text-indigo font-medium">成长曲线</a>
        <a href="个人中心.html" class="text-gray-500 hover:text-indigo">个人中心</a>
        <button onclick="location.href='配置页.html'" class="gradient-btn text-white font-medium px-5 py-2 rounded-lg">+ 新面试</button>
      </div>
    </div>
  </nav>

  <div class="max-w-5xl mx-auto px-6 py-8">
    <h1 class="text-2xl font-bold mb-6">我的成长轨迹 📈</h1>

    <!-- 概览卡片 -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
      <div class="bg-white rounded-2xl shadow-soft p-5">
        <div class="text-sm text-gray-400 mb-1">累计面试</div>
        <div class="text-3xl font-bold">12 <span class="text-base font-normal text-gray-400">次</span></div>
      </div>
      <div class="bg-white rounded-2xl shadow-soft p-5">
        <div class="text-sm text-gray-400 mb-1">最新得分</div>
        <div class="text-3xl font-bold gradient-text">78.5</div>
      </div>
      <div class="bg-white rounded-2xl shadow-soft p-5">
        <div class="text-sm text-gray-400 mb-1">最佳得分</div>
        <div class="text-3xl font-bold text-brandgreen">85.0</div>
      </div>
      <div class="bg-white rounded-2xl shadow-soft p-5">
        <div class="text-sm text-gray-400 mb-1">较首次提升</div>
        <div class="text-3xl font-bold text-brandgreen">+23.5</div>
      </div>
    </div>

    <!-- 总分趋势 -->
    <div class="bg-white rounded-2xl shadow-soft p-6 mb-6">
      <h2 class="text-lg font-bold mb-4">综合得分趋势</h2>
      <canvas id="trendChart" height="100"></canvas>
    </div>

    <!-- 各维度趋势 -->
    <div class="bg-white rounded-2xl shadow-soft p-6 mb-6">
      <h2 class="text-lg font-bold mb-4">各维度成长对比</h2>
      <canvas id="dimChart" height="110"></canvas>
    </div>

    <!-- 历史记录列表 -->
    <div class="bg-white rounded-2xl shadow-soft p-6">
      <h2 class="text-lg font-bold mb-4">历史面试记录</h2>
      <div class="space-y-2" id="historyList"></div>
    </div>
  </div>

    <script>
    // 读取真实历史
        const SUPABASE_URL = "https://skxpfgqylfpavoiurfhr.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNreHBmZ3F5bGZwYXZvaXVyZmhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0NjE5NTYsImV4cCI6MjA5NjAzNzk1Nn0._UcR6vWOppvwcqYaHFqIlKJrADRaRZDOpBDLIdPXncY";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let history = [];

    async function loadHistory(){
      const { data: { user } } = await supabaseClient.auth.getUser();
      if(user){
        // 已登录：读云端
        const { data, error } = await supabaseClient
          .from('interview_records')
          .select('*')
          .order('created_at', { ascending: false });
        if(!error && data){
              history = data.map(r => ({
              id:r.id, date:new Date(r.created_at).toLocaleString('zh-CN'),
              jobName:r.job_name, levelName:r.level_name, typeList:r.type_list,
              totalScore:r.total_score, scores:r.scores, report:r.report,
              qaRecords:r.qa_records, video_url:r.video_url
            }));

        }
      } else {
        // 未登录：读本地
        try { history = JSON.parse(localStorage.getItem('interviewHistory') || '[]'); } catch(e){}
      }
      initPage();
    }

    function initPage(){
      if (history.length === 0) {
        document.querySelector('.max-w-5xl').innerHTML = `
          <div class="text-center py-20">
            <div class="text-5xl mb-4">📊</div>
            <h2 class="text-xl font-bold mb-2">还没有面试记录</h2>
            <p class="text-gray-400 text-sm mb-6">完成一场模拟面试，这里就会显示你的成长轨迹</p>
            <button onclick="location.href='配置页.html'" class="gradient-btn text-white font-medium px-8 py-3 rounded-xl">开始第一场面试</button>
          </div>`;
      } else {
        renderStats(); renderTrend(); renderHistory();
      }
    }

    loadHistory();


    const DIM_NAMES = { jobMatch:'岗位匹配', logic:'逻辑清晰', fluency:'语言流畅', depth:'专业深度', confidence:'自信心', value:'价值表达' };

    function renderStats(){
      const scores = history.map(h=>h.totalScore);
      const latest = scores[0];
      const best = Math.max(...scores);
      const first = scores[scores.length-1];
      const improve = (latest - first).toFixed(1);
      const set = (txt, val) => { const el=[...document.querySelectorAll('.text-3xl')].find(e=>e.previousElementSibling && e.previousElementSibling.textContent.includes(txt)); if(el) el.innerHTML=val; };

      document.querySelectorAll('.grid .bg-white').forEach((card)=>{
        const label = card.querySelector('.text-sm')?.textContent || '';
        const numEl = card.querySelector('.text-3xl');
        if(!numEl) return;
        if(label.includes('累计面试')) numEl.innerHTML = history.length + ' <span class="text-base font-normal text-gray-400">次</span>';
        else if(label.includes('最新得分')) numEl.textContent = latest;
        else if(label.includes('最佳得分')) numEl.textContent = best;
        else if(label.includes('提升')) numEl.textContent = (improve>=0?'+':'') + improve;
      });
    }

    function renderTrend(){
      const recent = [...history].reverse(); // 时间正序
      new Chart(document.getElementById('trendChart'), {
        type:'line',
        data:{ labels: recent.map((h,i)=>`第${i+1}次`),
          datasets:[{ label:'综合得分', data: recent.map(h=>h.totalScore),
            borderColor:'#6366F1', backgroundColor:'rgba(99,102,241,0.1)', fill:true, tension:.3, pointRadius:5, pointBackgroundColor:'#6366F1' }]},
        options:{ scales:{ y:{min:0,max:100,grid:{color:'#F3F4F6'}}, x:{grid:{display:false}} }, plugins:{legend:{display:false}} }
      });

      // 维度对比(首次vs最新)
      const first = history[history.length-1].scores;
      const latest = history[0].scores;
      const keys = ['jobMatch','logic','fluency','depth','confidence','value'];
      new Chart(document.getElementById('dimChart'), {
        type:'bar',
        data:{ labels: keys.map(k=>DIM_NAMES[k]),
          datasets:[
            { label:'首次', data: keys.map(k=>first[k]||0), backgroundColor:'#E5E7EB', borderRadius:6 },
            { label:'最新', data: keys.map(k=>latest[k]||0), backgroundColor:'#6366F1', borderRadius:6 },
          ]},
        options:{ scales:{ y:{min:0,max:100,grid:{color:'#F3F4F6'}}, x:{grid:{display:false}} }, plugins:{legend:{position:'top'}} }
      });
    }

        function renderHistory(){
      const list=document.getElementById('historyList');
      list.innerHTML='';
      history.forEach((r, idx)=>{
        const c = r.totalScore>=80?'#10B981':r.totalScore>=60?'#6366F1':'#F59E0B';
        const el=document.createElement('div');
        el.className='flex items-center justify-between p-4 rounded-xl hover:bg-gray-50 transition cursor-pointer';
        // 点击：把这条报告存起来，跳转报告页查看
        el.addEventListener('click', ()=>{
          if(r.report){
            localStorage.setItem('viewHistoryReport', JSON.stringify(r));
            window.location.href = '报告页.html';
          } else {
            alert('这条旧记录没有保存详细报告（升级前的记录），新面试的记录可以查看详情。');
          }
        });
        el.innerHTML=`
          <div class="flex items-center gap-4">
            <div class="text-sm text-gray-400 w-32">${r.date}</div>
            <div class="text-sm font-medium">${r.jobName} · ${r.levelName}</div>
            <span class="text-xs bg-gray-100 text-gray-500 px-2 py-0.5 rounded">${r.typeList}</span>
          </div>
          <div class="flex items-center gap-3">
            <span class="text-lg font-bold" style="color:${c}">${r.totalScore}</span>
            <span class="text-gray-300 text-sm">查看报告 →</span>
          </div>`;
        list.appendChild(el);
      });
    }
  </script>
</body>
</html>
