  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: { indigo: { DEFAULT: '#6366F1' }, brandgreen: '#10B981', brandorange: '#F59E0B' },
      fontFamily: { sans: ['Inter','PingFang SC','Microsoft YaHei','sans-serif'] },

    body { background: #F9FAFB; color: #111827; }
    .gradient-btn { background: linear-gradient(135deg,#6366F1 0%,#8B5CF6 100%); transition: all .25s ease; }
    .gradient-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(99,102,241,0.4); }
    .gradient-text { background: linear-gradient(135deg,#6366F1 0%,#8B5CF6 100%); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
    .vip-card { background: linear-gradient(135deg,#1F2937 0%,#4338CA 100%); }
  
    /* 页面进入动画（暖色主题统一） */
    @keyframes pageFade { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:none} }
    body > div, body > main { animation: pageFade .5s ease both; }
  </style>
</head>

  <!-- 查看简历弹窗 -->
  <div id="resumeModal" class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[80vh] flex flex-col">

      </div>
      <div class="p-5 overflow-y-auto text-sm text-gray-600 whitespace-pre-wrap leading-relaxed" id="resumeContent"></div>
      <div class="p-4 border-t border-gray-100 text-right">
        <button onclick="location.href='简历管理.html'" class="gradient-btn text-white text-sm font-medium px-5 py-2 rounded-lg">管理全部版本</button>
      </div>

  <script>
    /* ============ Supabase（填你的）============ */
    const SUPABASE_URL = window.SUPABASE_URL;
    const SUPABASE_KEY = window.SUPABASE_KEY;
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let currentUser = null;
    let knowledgeItems = [];
    let knowledgeFilter = 'all';
    /* ================================== */

    async function init(){
      const { data: { user } } = await sb.auth.getUser();
      if(!user){
        alert('请先登录');
        location.href = '登录页.html';
        return;
      }
      currentUser = user;

      // 邮箱
      document.getElementById('sideEmail').textContent = user.email;
      document.getElementById('infoEmail').textContent = user.email;

      // 昵称（存本地，可编辑）
      const nickname = localStorage.getItem('nickname') || user.email.split('@')[0];
      setNickname(nickname);

      // 目标岗位
      document.getElementById('infoJob').textContent = localStorage.getItem('targetJob') || '未设置';

      // 简历状态
      const resumeInfo = localStorage.getItem('resumeInfo') || '';
      const versions = JSON.parse(localStorage.getItem('resumeVersions') || '[]');
      const onlineResume = localStorage.getItem('onlineResume');
      if(resumeInfo.trim() || versions.length || onlineResume){
        const s = document.getElementById('resumeStatus');
        s.textContent = `${onlineResume ? '在线简历' : '无在线简历'} · ${versions.length}/5 版附件`; s.className = 'text-brandgreen';
        document.getElementById('viewResumeBtn').classList.remove('hidden');
      }

      loadStats();
    }

    function escapeHtml(value){
      return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function localKey(name){
      const uid = currentUser?.id || 'anon';
      return `aimianjing:${uid}:${name}`;
    }

    function readLocalArray(name){
      try{ return JSON.parse(localStorage.getItem(localKey(name)) || '[]'); }
      catch(e){ return []; }
    }
    function writeLocalArray(name, arr){
      localStorage.setItem(localKey(name), JSON.stringify(arr));
    }

    function normalizeTags(value){
      if(Array.isArray(value)) return value.map(String).map(s=>s.trim()).filter(Boolean).slice(0,12);
      return String(value||'').split(/[,，、\s]+/).map(s=>s.trim()).filter(Boolean).slice(0,12);
    }

    function profileFromForm(){
      return {
        target_role: document.getElementById('profileTargetRole').value.trim(),
        target_companies: document.getElementById('profileTargetCompanies').value.trim(),
        background: document.getElementById('profileBackground').value.trim(),
        keywords: document.getElementById('profileKeywords').value.trim(),
        weekly_collect_enabled: document.getElementById('profileWeekly').checked,
      };
    }

    function fillProfileForm(profile={}){
      document.getElementById('profileTargetRole').value = profile.target_role || localStorage.getItem('targetJob') || '';
      document.getElementById('profileTargetCompanies').value = profile.target_companies || '';
      document.getElementById('profileBackground').value = profile.background || '';
      document.getElementById('profileKeywords').value = profile.keywords || '';
      document.getElementById('profileWeekly').checked = !!profile.weekly_collect_enabled;
      document.getElementById('infoJob').textContent = profile.target_role || localStorage.getItem('targetJob') || '未设置';
    }

    async function loadProfile(){
      const state = document.getElementById('profileSaveState');
      state.textContent = '加载中…';
      const localProfile = JSON.parse(localStorage.getItem(localKey('ragProfile')) || 'null');
      try{
        const { data, error } = await sb.from('user_profiles').select('*').eq('user_id', currentUser.id).maybeSingle();
        if(error) throw error;
        fillProfileForm(data || localProfile || {});
        state.textContent = data ? '已从云端加载' : '本地草稿';
      }catch(e){
        console.warn('个人背景云端加载失败，使用本地数据：', e);
        fillProfileForm(localProfile || {});
        state.textContent = '本地预览模式';
      }
    }

    async function saveProfile(){
      const state = document.getElementById('profileSaveState');
      const profile = profileFromForm();
      localStorage.setItem(localKey('ragProfile'), JSON.stringify(profile));
      if(profile.target_role){
        localStorage.setItem('targetJob', profile.target_role);
        document.getElementById('infoJob').textContent = profile.target_role;
      }
      state.textContent = '保存中…';
      try{
        const row = { user_id: currentUser.id, ...profile, updated_at: new Date().toISOString() };
        const { error } = await sb.from('user_profiles').upsert(row, { onConflict:'user_id' });
        if(error) throw error;
        state.textContent = '已保存到私有云端';
      }catch(e){
        console.warn('个人背景云端保存失败，已保存本地：', e);
        state.textContent = '已保存到本地（待建表后可云端保存）';
      }
    }

    function buildSearchPreview(){
      const p = profileFromForm();
      const parts = [
        p.target_role,
        p.target_companies,
        p.keywords,
        '面试经验',
        '面经',
        '面试题',
        '复盘',
      ].filter(Boolean);
      const queries = [
        parts.join(' '),
        [p.target_companies, p.target_role, '面试流程 经验'].filter(Boolean).join(' '),
        [p.target_role, p.keywords, '高频问题 回答思路'].filter(Boolean).join(' '),
      ].filter(Boolean);
      const box = document.getElementById('searchPreview');
      box.innerHTML = `<div class="font-semibold text-gray-700 mb-2">后续每周自动收集可用这些关键词：</div>${queries.map(q=>`<div class="bg-white border border-gray-100 rounded-lg px-3 py-2 mb-2">${escapeHtml(q)}</div>`).join('')}<div class="text-xs text-gray-400 mt-2">当前仅生成预览；自动搜索会在第二期接搜索 API + 定时任务。</div>`;
      box.classList.remove('hidden');
    }

    function typeLabel(type){
      return type === 'manual' ? '我的真实面经' : type === 'report' ? '模拟面试历史' : '外部面经情报';
    }

    function localKnowledgeUpsert(item){
      const arr = readLocalArray('knowledgeItems');
      const key = item.source_ref ? `${item.source}:${item.source_ref}` : item.id;
      const idx = arr.findIndex(x => (x.source_ref ? `${x.source}:${x.source_ref}` : x.id) === key);
      if(idx >= 0) arr[idx] = { ...arr[idx], ...item, updated_at:new Date().toISOString() };
      else arr.unshift({ id:item.id || `local_${Date.now()}_${Math.random().toString(16).slice(2)}`, ...item, created_at:new Date().toISOString() });
      writeLocalArray('knowledgeItems', arr.slice(0,200));
      return arr;
    }

    async function saveKnowledgeItem(item){
      const localItem = { ...item, tags: normalizeTags(item.tags), user_id: currentUser.id };
      localKnowledgeUpsert(localItem);
      try{
        const { data, error } = await sb.from('knowledge_items').upsert(localItem, { onConflict:'user_id,source,source_ref' }).select('*').single();
        if(error) throw error;
        return data;
      }catch(e){
        console.warn('知识条目云端保存失败，已保存本地：', e);
        return localItem;
      }
    }

    async function loadKnowledge(){
      const localItems = readLocalArray('knowledgeItems');
      try{
        const { data, error } = await sb.from('knowledge_items').select('*').eq('user_id', currentUser.id).order('created_at', { ascending:false }).limit(200);
        if(error) throw error;
        knowledgeItems = (data && data.length) ? data : localItems;
      }catch(e){
        console.warn('知识库云端加载失败，使用本地数据：', e);
        knowledgeItems = localItems;
      }
      renderKnowledge();
    }

    function setKnowledgeFilter(type){
      knowledgeFilter = type;
      document.querySelectorAll('.kb-filter').forEach(btn=>{
        const active = btn.dataset.kbFilter === type;
        btn.className = 'kb-filter rounded-xl px-4 py-3 text-left transition ' + (active ? 'bg-indigo text-white' : 'bg-gray-50 text-gray-600 hover:bg-gray-100');
      });
      renderKnowledge();
    }

    function renderKnowledge(){
      const all = knowledgeItems || [];
      const visible = knowledgeFilter === 'all' ? all : all.filter(x => x.source === knowledgeFilter);
      document.getElementById('kbCountAll').textContent = all.length;
      document.getElementById('kbCountManual').textContent = all.filter(x=>x.source==='manual').length;
      document.getElementById('kbCountReport').textContent = all.filter(x=>x.source==='report').length;
      const list = document.getElementById('knowledgeList');
      const empty = document.getElementById('knowledgeEmpty');
      list.innerHTML = '';
      empty.classList.toggle('hidden', visible.length > 0);
      visible.forEach(item=>{
        const tags = normalizeTags(item.tags);
        const div = document.createElement('div');
        div.className = 'border border-gray-100 rounded-2xl p-4 hover:border-indigo/30 hover:shadow-soft transition';
        div.innerHTML = `
          <div class="flex items-start justify-between gap-3 mb-2">
            <div>
              <div class="flex items-center gap-2 mb-1">
                <span class="text-[11px] px-2 py-0.5 rounded-full ${item.source==='manual'?'bg-emerald-50 text-brandgreen':item.source==='report'?'bg-indigo/10 text-indigo':'bg-amber-50 text-brandorange'}">${typeLabel(item.source)}</span>
                <span class="text-xs text-gray-300">${escapeHtml((item.created_at||'').slice(0,10))}</span>
              </div>
              <h3 class="font-semibold text-sm text-gray-800">${escapeHtml(item.title || '未命名知识')}</h3>
            </div>
          </div>
          <p class="text-sm text-gray-500 leading-relaxed whitespace-pre-wrap">${escapeHtml(item.summary || item.content || '').slice(0,260)}</p>
          ${tags.length ? `<div class="flex flex-wrap gap-1.5 mt-3">${tags.map(t=>`<span class="text-[11px] bg-gray-100 text-gray-500 px-2 py-0.5 rounded-full">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
        `;
        list.appendChild(div);
      });
    }

    async function addManualExperience(){
      const state = document.getElementById('kbSaveState');
      const company = document.getElementById('expCompany').value.trim();
      const role = document.getElementById('expRole').value.trim();
      const round = document.getElementById('expRound').value.trim();
      const tags = normalizeTags(document.getElementById('expTags').value);
      const content = document.getElementById('expContent').value.trim();
      if(!content){ state.textContent = '请先填写面试经验内容'; return; }
      state.textContent = '保存中…';
      const title = [company, role, round].filter(Boolean).join(' · ') || '我的面试经验';
      const item = {
        source:'manual',
        source_ref:`manual_${Date.now()}`,
        title,
        summary: content.slice(0,180),
        content,
        company,
        role,
        round,
        tags,
        metadata:{ company, role, round },
      };
      const saved = await saveKnowledgeItem(item);
      knowledgeItems = [saved, ...knowledgeItems.filter(x => !(x.source === saved.source && x.source_ref === saved.source_ref))];
      renderKnowledge();
      ['expCompany','expRole','expRound','expTags','expContent'].forEach(id=>document.getElementById(id).value='');
      state.textContent = '已保存到知识库';
    }

    function reportToKnowledgeItem(record){
      const report = record.report || {};
      const qa = record.qa_records || record.qaRecords || [];
      const total = record.total_score ?? record.totalScore ?? '';
      const job = record.job_name || record.jobName || '模拟面试';
      const level = record.level_name || record.levelName || '';
      const type = record.type_list || record.typeList || '综合面试';
      const title = `${job}${level ? ' · '+level : ''} · ${type} · 得分${total}`;
      const qaText = qa.map((r,i)=>`Q${i+1}: ${r.question || ''}\nA${i+1}: ${r.answer || ''}`).join('\n\n');
      const content = [
        `综合评价：${report.overallComment || ''}`,
        `改进建议：${(report.suggestions || []).join('；')}`,
        qaText,
      ].filter(Boolean).join('\n\n');
      return {
        source:'report',
        source_ref:String(record.id || record.created_at || record.date || `${job}_${Date.now()}`),
        title,
        summary: report.overallComment || `模拟面试报告，综合得分 ${total}`,
        content,
        company:'',
        role:job,
        round:type,
        tags:normalizeTags([job, level, type, '模拟面试', '报告']),
        metadata:{ score:total, scores:record.scores || report.scores || {}, qa_count:qa.length },
      };
    }

    async function syncReportKnowledge(opts={}){
      let count = 0;
      try{
        const { data, error } = await sb.from('interview_records').select('*').eq('user_id', currentUser.id).order('created_at', { ascending:false }).limit(100);
        if(error) throw error;
        for(const record of (data || [])){
          const item = reportToKnowledgeItem(record);
          const saved = await saveKnowledgeItem(item);
          knowledgeItems = [saved, ...knowledgeItems.filter(x => !(x.source === saved.source && x.source_ref === saved.source_ref))];
          count++;
        }
      }catch(e){
        console.warn('云端历史报告同步失败，尝试同步本地历史：', e);
        const localHistory = JSON.parse(localStorage.getItem('interviewHistory') || '[]');
        for(const record of localHistory){
          const item = reportToKnowledgeItem(record);
          const saved = await saveKnowledgeItem(item);
          knowledgeItems = [saved, ...knowledgeItems.filter(x => !(x.source === saved.source && x.source_ref === saved.source_ref))];
          count++;
        }
      }
      renderKnowledge();
      if(!opts.silent) alert(count ? `已同步 ${count} 份历史报告到知识库` : '暂无可同步的历史报告');
    }

    function setNickname(name){
      document.getElementById('nickname').textContent = name;
      document.getElementById('infoNickname').textContent = name;
      document.getElementById('avatar').textContent = name.charAt(0).toUpperCase();
    }

    // 统计数据（从云端历史读）
    async function loadStats(){
      try {
        const { data: { user } } = await sb.auth.getUser();
        if(!user){
          document.getElementById('statCount').textContent = '0';
          document.getElementById('statBest').textContent = '0';
          document.getElementById('statImprove').textContent = '0';
          return;
        }
        const { data, error } = await sb.from('interview_records').select('total_score').eq('user_id', user.id).order('created_at', { ascending: false });
        if(error || !data || !data.length){
          document.getElementById('statCount').textContent = '0';
          document.getElementById('statBest').textContent = '0';
          document.getElementById('statImprove').textContent = '0';
          return;
        }
        const scores = data.map(r => r.total_score);
        const best = Math.max(...scores).toFixed(1);
        const latest = scores[0];
        const previous = scores[1] ?? latest;
        const improve = (latest - previous).toFixed(1);
        document.getElementById('statCount').textContent = data.length;
        document.getElementById('statBest').textContent = best;
        document.getElementById('statImprove').textContent = (improve>=0?'+':'') + improve;
      } catch(e){ console.warn('统计加载失败', e); }
    }

    // 编辑昵称
    function editNickname(){
      const cur = localStorage.getItem('nickname') || '';
      const name = prompt('请输入新昵称：', cur);
      if(name && name.trim()){
        localStorage.setItem('nickname', name.trim());
        setNickname(name.trim());
        alert('昵称已更新');
      }
    }

    // 编辑目标岗位
    function editJob(){
      const cur = localStorage.getItem('targetJob') || '';
      const job = prompt('请输入目标岗位：', cur);
      if(job && job.trim()){
        localStorage.setItem('targetJob', job.trim());
        document.getElementById('infoJob').textContent = job.trim();
        alert('目标岗位已更新');
      }
    }

    // 查看简历
    function viewResume(){
      const resumeInfo = localStorage.getItem('resumeInfo') || '（暂无简历内容）';
      document.getElementById('resumeContent').textContent = resumeInfo;
      const m = document.getElementById('resumeModal');
      m.classList.remove('hidden'); m.classList.add('flex');
    }
    function closeResume(){
      const m = document.getElementById('resumeModal');
      m.classList.add('hidden'); m.classList.remove('flex');
    }

    // 退出登录
    async function logout(){
      if(!confirm('确定要退出登录吗？')) return;
      await sb.auth.signOut();
      alert('已退出登录');
      location.href = 'index.html';
    }

    init();
  </script>
</body>
</html>
