<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>个人中心 - AI面镜</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: { indigo: { DEFAULT: '#6366F1' }, brandgreen: '#10B981', brandorange: '#F59E0B' },
      fontFamily: { sans: ['Inter','PingFang SC','Microsoft YaHei','sans-serif'] },
      boxShadow: { soft:'0 4px 20px rgba(99,102,241,0.08)', softlg:'0 10px 40px rgba(99,102,241,0.15)' },
    }}};
  </script>
  <style>
    body { background: #F9FAFB; color: #111827; }
    .gradient-btn { background: linear-gradient(135deg,#6366F1 0%,#8B5CF6 100%); transition: all .25s ease; }
    .gradient-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(99,102,241,0.4); }
    .gradient-text { background: linear-gradient(135deg,#6366F1 0%,#8B5CF6 100%); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
    .vip-card { background: linear-gradient(135deg,#1F2937 0%,#4338CA 100%); }
  
    /* 页面进入动画（暖色主题统一） */
    @keyframes pageFade { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:none} }
    body > div, body > main { animation: pageFade .5s ease both; }
  </style>
</head>
<body class="font-sans antialiased">

  <nav class="bg-white border-b border-gray-100 sticky top-0 z-40">
    <div class="max-w-5xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-xl gradient-btn flex items-center justify-center text-white text-lg">🪞</div>
        <span class="text-xl font-bold">AI面镜</span>
      </a>
      <div class="flex items-center gap-4 text-sm">
        <a href="历史成长.html" class="text-gray-500 hover:text-indigo">成长曲线</a>
        <a href="专项训练.html" class="text-gray-500 hover:text-indigo">专项训练</a>
        <a href="个人中心.html" class="text-indigo font-medium">个人中心</a>
        <button onclick="location.href='配置页.html'" class="gradient-btn text-white font-medium px-5 py-2 rounded-lg">+ 新面试</button>
      </div>
    </div>
  </nav>

  <div class="max-w-5xl mx-auto px-6 py-8">
    <div class="grid md:grid-cols-[260px_1fr] gap-6">

      <aside>
        <div class="bg-white rounded-2xl shadow-soft p-6 mb-4 text-center">
          <div class="w-20 h-20 rounded-full bg-indigo/10 flex items-center justify-center text-3xl text-indigo font-bold mx-auto mb-3" id="avatar">U</div>
          <h3 class="font-bold text-lg" id="nickname">加载中...</h3>
          <p class="text-sm text-gray-400" id="sideEmail">--</p>
          <span class="inline-block mt-2 bg-gray-100 text-gray-500 text-xs px-3 py-1 rounded-full">免费用户</span>
        </div>
        <div class="bg-white rounded-2xl shadow-soft p-2">
          <a href="个人中心.html" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-indigo/5 text-indigo text-sm font-medium">👤 账户信息</a>
          <a href="历史成长.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-50 text-sm text-gray-600">📈 历史成长</a>
          <a href="会员.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-50 text-sm text-gray-600">💳 我的会员</a>
          <a href="简历管理.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-50 text-sm text-gray-600">📄 简历管理</a>
          <a href="设置.html" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-50 text-sm text-gray-600">⚙️ 设置</a>
          <a href="#" onclick="logout();return false;" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-50 text-sm text-brandorange">🚪 退出登录</a>
        </div>
      </aside>

      <main>
        <div class="vip-card rounded-2xl p-7 mb-6 text-white relative overflow-hidden">
          <div class="relative z-10">
            <h2 class="text-xl font-bold mb-1">✨ 升级会员，解锁全部能力</h2>
            <p class="text-white/70 text-sm mb-4">无限次面试 · 高分回答对比 · 个性化练习计划 · PDF导出</p>
            <button onclick="location.href='会员.html'" class="bg-white text-indigo font-medium px-6 py-2.5 rounded-xl hover:scale-105 transition">立即升级 ¥199/年</button>
          </div>
          <div class="absolute top-0 right-0 w-48 h-48 bg-white/10 rounded-full -mr-16 -mt-16"></div>
        </div>

        <div class="bg-white rounded-2xl shadow-soft p-6 mb-6">
          <h2 class="text-lg font-bold mb-4">使用概况</h2>
          <div class="grid grid-cols-3 gap-4">
            <div class="text-center"><div class="text-2xl font-bold gradient-text" id="statCount">0</div><div class="text-sm text-gray-400 mt-1">累计面试</div></div>
            <div class="text-center"><div class="text-2xl font-bold gradient-text" id="statBest">0</div><div class="text-sm text-gray-400 mt-1">最佳得分</div></div>
            <div class="text-center"><div class="text-2xl font-bold gradient-text" id="statImprove">0</div><div class="text-sm text-gray-400 mt-1">较上次提升</div></div>
          </div>
        </div>

        <div class="bg-white rounded-2xl shadow-soft p-6">
          <h2 class="text-lg font-bold mb-4">账户信息</h2>
          <div class="space-y-4">
            <div class="flex items-center justify-between py-2 border-b border-gray-50">
              <span class="text-sm text-gray-400">昵称</span>
              <span class="text-sm font-medium"><span id="infoNickname">--</span> <button onclick="editNickname()" class="text-indigo text-xs ml-2">编辑</button></span>
            </div>
            <div class="flex items-center justify-between py-2 border-b border-gray-50">
              <span class="text-sm text-gray-400">邮箱</span><span class="text-sm font-medium" id="infoEmail">--</span>
            </div>
            <div class="flex items-center justify-between py-2 border-b border-gray-50">
              <span class="text-sm text-gray-400">目标岗位</span>
              <span class="text-sm font-medium"><span id="infoJob">未设置</span> <button onclick="editJob()" class="text-indigo text-xs ml-2">编辑</button></span>
            </div>
            <div class="flex items-center justify-between py-2 border-b border-gray-50">
              <span class="text-sm text-gray-400">简历</span>
              <span class="text-sm font-medium">
                <span id="resumeStatus" class="text-gray-400">未上传</span>
                <button onclick="viewResume()" id="viewResumeBtn" class="text-indigo text-xs ml-2 hidden">查看</button>
                <button onclick="location.href='简历管理.html'" class="text-indigo text-xs ml-2">管理</button>
              </span>
            </div>
            <div class="flex items-center justify-between py-2">
              <span class="text-sm text-gray-400">会员状态</span><span class="text-sm font-medium">免费用户</span>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- 查看简历弹窗 -->
  <div id="resumeModal" class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[80vh] flex flex-col">
      <div class="flex items-center justify-between p-5 border-b border-gray-100">
        <h3 class="font-bold">我的简历</h3>
        <button onclick="closeResume()" class="text-gray-400 hover:text-gray-600 text-xl">✕</button>
      </div>
      <div class="p-5 overflow-y-auto text-sm text-gray-600 whitespace-pre-wrap leading-relaxed" id="resumeContent"></div>
      <div class="p-4 border-t border-gray-100 text-right">
        <button onclick="location.href='简历管理.html'" class="gradient-btn text-white text-sm font-medium px-5 py-2 rounded-lg">管理全部版本</button>
      </div>
    </div>
  </div>

  <script>
    /* ============ Supabase（填你的）============ */
    const SUPABASE_URL = "https://skxpfgqylfpavoiurfhr.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNreHBmZ3F5bGZwYXZvaXVyZmhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0NjE5NTYsImV4cCI6MjA5NjAzNzk1Nn0._UcR6vWOppvwcqYaHFqIlKJrADRaRZDOpBDLIdPXncY";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    /* ================================== */

    async function init(){
      const { data: { user } } = await sb.auth.getUser();
      if(!user){
        alert('请先登录');
        location.href = '登录页.html';
        return;
      }

      // 邮箱
      document.getElementById('sideEmail').textContent = user.email;
      document.getElementById('infoEmail').textContent = user.email;

      // 昵称（存本地，可编辑）
      const nickname = localStorage.getItem('nickname') || user.email.split('@')[0];
      setNickname(nickname);

      // 目标岗位
      document.getElementById('infoJob').textContent = localStorage.getItem('targetJob') || '未设置';

      // 简历状态
      const resumeInfo = localStorage.getItem('resumeInfo') || '';
      const versions = JSON.parse(localStorage.getItem('resumeVersions') || '[]');
      const onlineResume = localStorage.getItem('onlineResume');
      if(resumeInfo.trim() || versions.length || onlineResume){
        const s = document.getElementById('resumeStatus');
        s.textContent = `${onlineResume ? '在线简历' : '无在线简历'} · ${versions.length}/5 版附件`; s.className = 'text-brandgreen';
        document.getElementById('viewResumeBtn').classList.remove('hidden');
      }

      loadStats();
    }

    function setNickname(name){
      document.getElementById('nickname').textContent = name;
      document.getElementById('infoNickname').textContent = name;
      document.getElementById('avatar').textContent = name.charAt(0).toUpperCase();
    }

    // 统计数据（从云端历史读）
    async function loadStats(){
      try {
        const { data: { user } } = await sb.auth.getUser();
        if(!user){
          document.getElementById('statCount').textContent = '0';
          document.getElementById('statBest').textContent = '0';
          document.getElementById('statImprove').textContent = '0';
          return;
        }
        const { data, error } = await sb.from('interview_records').select('total_score').eq('user_id', user.id).order('created_at', { ascending: false });
        if(error || !data || !data.length){
          document.getElementById('statCount').textContent = '0';
          document.getElementById('statBest').textContent = '0';
          document.getElementById('statImprove').textContent = '0';
          return;
        }
        const scores = data.map(r => r.total_score);
        const best = Math.max(...scores).toFixed(1);
        const latest = scores[0];
        const previous = scores[1] ?? latest;
        const improve = (latest - previous).toFixed(1);
        document.getElementById('statCount').textContent = data.length;
        document.getElementById('statBest').textContent = best;
        document.getElementById('statImprove').textContent = (improve>=0?'+':'') + improve;
      } catch(e){ console.warn('统计加载失败', e); }
    }

    // 编辑昵称
    function editNickname(){
      const cur = localStorage.getItem('nickname') || '';
      const name = prompt('请输入新昵称：', cur);
      if(name && name.trim()){
        localStorage.setItem('nickname', name.trim());
        setNickname(name.trim());
        alert('昵称已更新');
      }
    }

    // 编辑目标岗位
    function editJob(){
      const cur = localStorage.getItem('targetJob') || '';
      const job = prompt('请输入目标岗位：', cur);
      if(job && job.trim()){
        localStorage.setItem('targetJob', job.trim());
        document.getElementById('infoJob').textContent = job.trim();
        alert('目标岗位已更新');
      }
    }

    // 查看简历
    function viewResume(){
      const resumeInfo = localStorage.getItem('resumeInfo') || '（暂无简历内容）';
      document.getElementById('resumeContent').textContent = resumeInfo;
      const m = document.getElementById('resumeModal');
      m.classList.remove('hidden'); m.classList.add('flex');
    }
    function closeResume(){
      const m = document.getElementById('resumeModal');
      m.classList.add('hidden'); m.classList.remove('flex');
    }

    // 退出登录
    async function logout(){
      if(!confirm('确定要退出登录吗？')) return;
      await sb.auth.signOut();
      alert('已退出登录');
      location.href = 'index.html';
    }

    init();
  </script>
</body>
</html>
