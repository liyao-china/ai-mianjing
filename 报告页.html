<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>面试报告 - AI面镜</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: { indigo: { DEFAULT: '#6366F1' }, brandgreen: '#10B981', brandorange: '#F59E0B' },
      fontFamily: { sans: ['Inter','PingFang SC','Microsoft YaHei','sans-serif'] },
      boxShadow: { soft:'0 4px 20px rgba(99,102,241,0.08)', softlg:'0 10px 40px rgba(99,102,241,0.15)' },
    }}};
  </script>
  <style>
    body { background: #F9FAFB; color: #111827; }
    .gradient-btn { background: linear-gradient(135deg,#6366F1 0%,#8B5CF6 100%); transition: all .25s ease; }
    .gradient-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(99,102,241,0.4); }
    .gradient-text { background: linear-gradient(135deg,#6366F1 0%,#8B5CF6 100%); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { animation: spin 1s linear infinite; }
  </style>
</head>
<body class="font-sans antialiased">

  <nav class="bg-white border-b border-gray-100 sticky top-0 z-40">
    <div class="max-w-4xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2">
        <div class="w-9 h-9 rounded-xl gradient-btn flex items-center justify-center text-white text-lg">🪞</div>
        <span class="text-xl font-bold">AI面镜</span>
      </a>
      <div class="flex items-center gap-2">
        <button onclick="location.href='历史成长.html'" class="text-sm text-gray-500 hover:text-indigo px-3 py-2">← 历史记录</button>
        <button onclick="location.href='配置页.html'" class="gradient-btn text-white text-sm font-medium px-5 py-2 rounded-lg">🔄 再练一次</button>
      </div>
    </div>
  </nav>

  <div id="loadingView" class="max-w-4xl mx-auto px-6 py-20 text-center">
    <div class="w-16 h-16 border-4 border-indigo/20 border-t-indigo rounded-full spinner mx-auto mb-6"></div>
    <h2 class="text-xl font-bold mb-2">AI 正在分析你的面试表现...</h2>
    <p class="text-gray-400 text-sm" id="loadingTip">正在从 6 个维度综合评估，请稍候（约 10-20 秒）</p>
  </div>

  <div id="reportView" class="max-w-4xl mx-auto px-6 py-8 hidden">
    <div class="mb-6">
      <h1 class="text-2xl font-bold mb-1">面试报告</h1>
      <p class="text-sm text-gray-400" id="reportMeta">AI产品经理 · 中级</p>
    </div>

    <div class="bg-white rounded-2xl shadow-soft p-7 mb-6">
      <div class="grid md:grid-cols-2 gap-8 items-center">
        <div class="text-center md:text-left">
          <div class="text-sm text-gray-400 mb-1">综合得分</div>
          <div class="flex items-end gap-3 justify-center md:justify-start mb-3">
            <span class="text-6xl font-bold gradient-text" id="totalScore">--</span>
            <span class="text-lg font-medium text-gray-500 mb-2">/ 100</span>
          </div>
          <div class="mb-4"><span class="bg-indigo/10 text-indigo px-3 py-1 rounded-full text-sm font-medium" id="levelTag">--</span></div>
          <p class="text-sm text-gray-500 leading-relaxed" id="overallComment">--</p>
        </div>
        <div class="flex justify-center"><div class="w-full max-w-[300px]"><canvas id="radarChart"></canvas></div></div>
      </div>
    </div>

    <!-- 面试回放视频 -->
    <div id="videoSection" class="bg-white rounded-2xl shadow-soft p-6 mb-6 hidden">
      <h2 class="text-lg font-bold mb-4 flex items-center gap-2">🎬 面试录像回放</h2>
      <video id="replayVideo" controls class="w-full rounded-xl bg-black" style="max-height:400px;"></video>
      <p class="text-xs text-gray-400 mt-2">测试版回放链接可能被持有链接的人访问，请勿分享或录制敏感内容。</p>
    </div>

    <div class="bg-white rounded-2xl shadow-soft p-7 mb-6">
      <h2 class="text-lg font-bold mb-5">各维度得分</h2>
      <div class="grid md:grid-cols-2 gap-x-10 gap-y-4" id="dimBars"></div>
    </div>

    <div class="bg-gradient-to-br from-indigo/5 to-purple-100/20 rounded-2xl p-7 mb-6">
      <h2 class="text-lg font-bold mb-4 flex items-center gap-2">💡 重点改进建议</h2>
      <div class="space-y-3" id="suggestions"></div>
    </div>

    <div class="mb-6">
      <h2 class="text-lg font-bold mb-4 px-1">📋 逐题详细点评</h2>
      <div class="space-y-3" id="questionList"></div>
    </div>

    <div class="flex flex-col sm:flex-row gap-3 justify-center">
      <button onclick="location.href='配置页.html'" class="gradient-btn text-white font-medium px-8 py-3 rounded-xl">🔄 再练一次</button>
      <button onclick="location.href='历史成长.html'" class="bg-white border-2 border-gray-200 font-medium px-8 py-3 rounded-xl hover:border-indigo hover:text-indigo transition">查看历史成长</button>
    </div>
  </div>

  <div id="errorView" class="max-w-2xl mx-auto px-6 py-20 text-center hidden">
    <div class="text-5xl mb-4">😅</div>
    <h2 class="text-xl font-bold mb-2">评分生成失败</h2>
    <p class="text-gray-400 text-sm mb-6" id="errorMsg">请重试</p>
    <button onclick="retryReport()" class="gradient-btn text-white font-medium px-8 py-3 rounded-xl">重新生成</button>
  </div>

  <script>
    /* ============ Supabase ============ */
    const SUPABASE_URL = "https://skxpfgqylfpavoiurfhr.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNreHBmZ3F5bGZwYXZvaXVyZmhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0NjE5NTYsImV4cCI6MjA5NjAzNzk1Nn0._UcR6vWOppvwcqYaHFqIlKJrADRaRZDOpBDLIdPXncY";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    /* ============ AI（填你的Key）============ */
    const API_KEY = "sk-ebd50b34fb01401da5d5e02caddfa24e";
    const MODEL = "qwen3.7-plus";
    const API_URL = "https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions";
    /* ================================== */

    const DIMENSIONS = [
      { key:'jobMatch', name:'岗位匹配度', weight:30, color:'#10B981' },
      { key:'logic', name:'逻辑清晰度', weight:25, color:'#6366F1' },
      { key:'fluency', name:'语言流畅度', weight:15, color:'#F59E0B' },
      { key:'depth', name:'专业深度', weight:15, color:'#6366F1' },
      { key:'confidence', name:'自信心', weight:10, color:'#10B981' },
      { key:'value', name:'价值表达', weight:5, color:'#F59E0B' },
    ];

    let jobName='', levelName='', meta={}, qaRecords=[], isViewMode=false;
    const isSampleMode = new URLSearchParams(location.search).get('sample') === '1';
    const SAMPLE_QA = [
      { question:'请介绍一个你主导的 AI 产品项目，以及你解决的核心问题。', answer:'我主导了客服 RAG 助手，从用户访谈、指标设计到灰度上线，重点解决检索准确率和答案可信度问题。' },
      { question:'你如何验证产品效果并推动持续优化？', answer:'我同时跟踪离线召回指标与线上采纳率、处理时长，通过失败案例回流持续完善评测集。' }
    ];
    const SAMPLE_REPORT = {
      scores:{jobMatch:86,logic:82,fluency:80,depth:78,confidence:81,value:84},
      overallComment:'具备较完整的 AI 产品落地思路，下一步需要补充更具体的技术权衡与协作案例。',
      suggestions:['补充项目规模、个人职责和关键决策依据。','用更具体的失败案例说明复盘与迭代过程。','加强对成本、延迟和准确率之间权衡的表达。'],
      questions:[
        {score:84,good:['项目目标和结果表达清楚'],bad:['缺少项目规模和个人贡献占比']},
        {score:81,good:['能够结合离线与线上指标'],bad:['可进一步说明指标异常时的决策过程']}
      ]
    };

    const viewHistoryRaw = localStorage.getItem('viewHistoryReport');
    if (isSampleMode) {
      isViewMode = true;
      jobName='AI产品经理'; levelName='中级'; meta={typeList:'示例报告'}; qaRecords=SAMPLE_QA;
      document.getElementById('reportMeta').textContent='AI产品经理 · 中级 · 示例报告';
      renderReport(SAMPLE_REPORT);
    } else if (viewHistoryRaw) {
      isViewMode = true;
      localStorage.removeItem('viewHistoryReport');
      try {
        const hist = JSON.parse(viewHistoryRaw);
        jobName = hist.jobName; levelName = hist.levelName;
        meta = { typeList: hist.typeList };
        qaRecords = hist.qaRecords || hist.qa_records || [];
        document.getElementById('reportMeta').textContent = `${jobName} · ${levelName} · ${hist.typeList||'综合面试'} · ${hist.date||''}`;
        renderReport(hist.report);
        // 历史回放视频
        if(hist.video_url){
          document.getElementById('videoSection').classList.remove('hidden');
          document.getElementById('replayVideo').src = hist.video_url;
        }
      } catch(e){ showError('历史报告读取失败：'+e.message); }
    } else {
      try { qaRecords = JSON.parse(localStorage.getItem('qaRecords')) || []; } catch(e){}
      try { meta = JSON.parse(localStorage.getItem('interviewMeta')) || {}; } catch(e){}
      jobName = meta.jobName || 'AI产品经理';
      levelName = meta.levelName || '中级';
      document.getElementById('reportMeta').textContent = `${jobName} · ${levelName} · ${meta.typeList||'综合面试'}`;

      // 本次录制的视频
      const thisVideo = localStorage.getItem('videoUrl');
      if(thisVideo){
        document.getElementById('videoSection').classList.remove('hidden');
        document.getElementById('replayVideo').src = thisVideo;
      }

      const cachedReport = localStorage.getItem('currentInterviewReport');
      if(!qaRecords.length){ showError('没有找到面试记录，请先完成一场面试。'); }
      else if(cachedReport){
        try { renderReport(JSON.parse(cachedReport)); }
        catch(e){ localStorage.removeItem('currentInterviewReport'); generateReport(); }
      } else { generateReport(); }
    }

    function parseReport(content){
      const cleaned = content.trim().replace(/```json/gi,'').replace(/```/g,'').trim();
      const start=cleaned.indexOf('{'), end=cleaned.lastIndexOf('}');
      if(start<0 || end<=start) throw new Error('返回内容不是有效报告');
      const result=JSON.parse(cleaned.slice(start,end+1));
      const required=['jobMatch','logic','fluency','depth','confidence','value'];
      if(!result.scores || required.some(k=>!Number.isFinite(Number(result.scores[k])))) throw new Error('评分维度不完整');
      result.scores=Object.fromEntries(required.map(k=>[k,Math.max(0,Math.min(100,Number(result.scores[k])))]));
      result.suggestions=Array.isArray(result.suggestions)?result.suggestions.slice(0,3):[];
      result.questions=Array.isArray(result.questions)?result.questions.slice(0,qaRecords.length):[];
      return result;
    }

    function escapeHtml(value){
      return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    async function generateReport(attempt=0){
      let qaText='';
      qaRecords.forEach((r,i)=>{ qaText += `问题${i+1}：${r.question}\n候选人回答：${r.answer}\n\n`; });
      const prompt = `你是一位严格、专业的面试评分专家。请根据以下面试问答记录，对候选人（应聘${jobName}，${levelName}级别）进行专业评分。

【面试问答记录】
${qaText}
【评分维度与权重】
1. 岗位匹配度(30%) 2. 逻辑清晰度(25%) 3. 语言流畅度(15%) 4. 专业深度(15%) 5. 自信心(10%) 6. 价值表达(5%)
【要求】每个维度0-100分；给3条整体改进建议；每题给得分(0-100)、1-2条亮点、1-2条改进点；严格客观。
【必须严格按以下JSON格式返回，不要任何其他文字，不要markdown代码块】
{"scores":{"jobMatch":数字,"logic":数字,"fluency":数字,"depth":数字,"confidence":数字,"value":数字},"overallComment":"一句话评价(50字内)","suggestions":["建议1","建议2","建议3"],"questions":[{"score":数字,"good":["亮点"],"bad":["改进"]}]}`;

      try {
        document.getElementById('loadingTip').textContent = 'AI 正在逐题分析，请稍候...';
        const res = await fetch(API_URL,{ method:'POST',
          headers:{'Authorization':'Bearer '+API_KEY,'Content-Type':'application/json'},
          body: JSON.stringify({ model:MODEL, enable_thinking:false, messages:[
            {role:'system',content:'你是专业的面试评分专家，只返回JSON格式的评分结果。'},
            {role:'user',content:prompt}]})});
        const data = await res.json();
        if(data.error) throw new Error(JSON.stringify(data.error));
        const content = data.choices[0].message.content || '';
        const result = parseReport(content);
        localStorage.setItem('currentInterviewReport', JSON.stringify(result));
        renderReport(result);
        saveToCloud(result);
      } catch(err){
        console.error(err);
        if(attempt<2){
          document.getElementById('loadingTip').textContent=`报告格式校验未通过，正在自动重试（${attempt+2}/3）...`;
          setTimeout(()=>generateReport(attempt+1),700);
        } else {
          showError('报告生成暂时失败，请点击重新生成。你的面试记录已保存。');
        }
      }
    }

    function retryReport(){
      document.getElementById('errorView').classList.add('hidden');
      document.getElementById('loadingView').classList.remove('hidden');
      localStorage.removeItem('currentInterviewReport');
      generateReport();
    }

    async function saveToCloud(result){
      if(isViewMode) return;
      let total=0; DIMENSIONS.forEach(d=> total+=(result.scores[d.key]||0)*d.weight/100); total=total.toFixed(1);
      try {
        const { data: { user } } = await sb.auth.getUser();
        if (user) {
          const videoUrl = localStorage.getItem('videoUrl') || null;
          const { error } = await sb.from('interview_records').insert({
            user_id: user.id,
            job_name: jobName,
            level_name: levelName,
            type_list: meta.typeList || '综合面试',
            total_score: parseFloat(total),
            scores: result.scores,
            qa_records: qaRecords,
            report: result,
            video_url: videoUrl
          });
          if(error) console.warn('云端保存失败:', error); else console.log('✅ 已保存到云端');
          localStorage.removeItem('videoUrl');
        } else {
          const videoUrl = localStorage.getItem('videoUrl') || null;
          const history = JSON.parse(localStorage.getItem('interviewHistory') || '[]');
          history.unshift({ date:new Date().toLocaleString('zh-CN'), jobName, levelName, typeList:meta.typeList||'综合面试', totalScore:parseFloat(total), scores:result.scores, qaRecords, report:result, video_url:videoUrl });
          localStorage.setItem('interviewHistory', JSON.stringify(history.slice(0,20)));
          localStorage.removeItem('videoUrl');
        }
      } catch(e){ console.warn('保存异常', e); }
    }

    function renderReport(result){
      const scores = result.scores;
      let total=0; DIMENSIONS.forEach(d=> total+=(scores[d.key]||0)*d.weight/100); total=total.toFixed(1);
      let level='待加强';
      if(total>=92)level='专家水平'; else if(total>=80)level='高级水平'; else if(total>=60)level='中级水平'; else if(total>=40)level='初级水平';
      document.getElementById('totalScore').textContent=total;
      document.getElementById('levelTag').textContent=level;
      document.getElementById('overallComment').textContent=result.overallComment||'';

      new Chart(document.getElementById('radarChart'),{ type:'radar',
        data:{ labels:DIMENSIONS.map(d=>d.name),
          datasets:[{ data:DIMENSIONS.map(d=>scores[d.key]||0), backgroundColor:'rgba(99,102,241,0.15)', borderColor:'#6366F1', borderWidth:2, pointBackgroundColor:'#6366F1', pointRadius:4 }]},
        options:{ scales:{ r:{min:0,max:100,ticks:{stepSize:20,color:'#9CA3AF',backdropColor:'transparent',font:{size:10}},grid:{color:'#E5E7EB'},angleLines:{color:'#E5E7EB'},pointLabels:{color:'#374151',font:{size:12}}}}, plugins:{legend:{display:false}} }});

      const dimBars=document.getElementById('dimBars'); dimBars.innerHTML='';
      DIMENSIONS.forEach(d=>{ const s=scores[d.key]||0; const el=document.createElement('div');
        el.innerHTML=`<div class="flex justify-between items-center mb-1.5"><span class="text-sm text-gray-600">${d.name} <span class="text-xs text-gray-300">权重${d.weight}%</span></span><span class="text-sm font-bold" style="color:${d.color}">${s}</span></div><div class="h-2.5 bg-gray-100 rounded-full overflow-hidden"><div class="h-2.5 rounded-full transition-all duration-1000" style="width:0%;background:${d.color}" data-w="${s}"></div></div>`;
        dimBars.appendChild(el); });
      setTimeout(()=>{ document.querySelectorAll('[data-w]').forEach(b=> b.style.width=b.dataset.w+'%'); },300);

      const sg=document.getElementById('suggestions'); sg.innerHTML='';
      (result.suggestions||[]).forEach((s,i)=>{ const el=document.createElement('div'); el.className='flex gap-3 bg-white rounded-xl p-4';
        el.innerHTML=`<div class="w-6 h-6 rounded-full gradient-btn text-white text-xs flex items-center justify-center flex-shrink-0">${i+1}</div><div class="flex-1 text-sm text-gray-700">${escapeHtml(s)}</div><button class="text-xs text-indigo hover:underline whitespace-nowrap" onclick="location.href='配置页.html'">专项练习 →</button>`; sg.appendChild(el); });

      const qList=document.getElementById('questionList'); qList.innerHTML='';
      (result.questions||[]).forEach((item,idx)=>{ const rec=qaRecords[idx]||{}; const sc=item.score||0;
        const color=sc>=80?'#10B981':sc>=60?'#6366F1':'#F59E0B';
        const card=document.createElement('div'); card.className='bg-white rounded-2xl shadow-soft overflow-hidden';
        card.innerHTML=`<div class="flex items-center justify-between p-5 cursor-pointer toggle-head"><div class="flex items-center gap-3 flex-1"><span class="text-xs text-gray-400">Q${idx+1}</span><span class="text-sm font-medium text-gray-700">${escapeHtml(rec.question||'')}</span></div><div class="flex items-center gap-3"><span class="text-lg font-bold" style="color:${color}">${sc}</span><span class="toggle-icon text-gray-400 transition-transform">▼</span></div></div><div class="toggle-body hidden px-5 pb-5 border-t border-gray-50 pt-4"><div class="grid md:grid-cols-2 gap-4 mb-4"><div><div class="text-xs font-semibold text-brandgreen mb-2">✅ 亮点</div><ul class="space-y-1.5">${(item.good||[]).map(g=>`<li class="text-sm text-gray-600 flex gap-1.5"><span class="text-brandgreen">·</span>${escapeHtml(g)}</li>`).join('')}</ul></div><div><div class="text-xs font-semibold text-brandorange mb-2">⚠️ 改进点</div><ul class="space-y-1.5">${(item.bad||[]).map(b=>`<li class="text-sm text-gray-600 flex gap-1.5"><span class="text-brandorange">·</span>${escapeHtml(b)}</li>`).join('')}</ul></div></div><div><div class="text-xs font-semibold text-gray-500 mb-2">📝 你的回答</div><div class="bg-gray-50 rounded-xl p-4 text-sm text-gray-600 leading-relaxed">${escapeHtml(rec.answer||'')}</div></div></div>`;
        qList.appendChild(card);
        const head=card.querySelector('.toggle-head'),body=card.querySelector('.toggle-body'),icon=card.querySelector('.toggle-icon');
        head.addEventListener('click',()=>{ body.classList.toggle('hidden'); icon.style.transform=body.classList.contains('hidden')?'rotate(0)':'rotate(180deg)'; });
        if(idx===0){ body.classList.remove('hidden'); icon.style.transform='rotate(180deg)'; }
      });

      document.getElementById('loadingView').classList.add('hidden');
      document.getElementById('reportView').classList.remove('hidden');
    }

    function showError(msg){
      document.getElementById('loadingView').classList.add('hidden');
      document.getElementById('errorView').classList.remove('hidden');
      document.getElementById('errorMsg').textContent=msg;
    }
  </script>
</body>
</html>
