<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设置 - AI面镜</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-[#F9FAFB] text-gray-800"><main class="max-w-2xl mx-auto px-6 py-12">
<a href="个人中心.html" class="text-[#6366F1]">← 返回个人中心</a>
<div class="bg-white rounded-2xl p-8 mt-6 shadow-sm"><h1 class="text-3xl font-bold mb-6">设置</h1>
<h2 class="font-bold mb-2">本地数据</h2><p class="text-sm text-gray-500 mb-4">清除当前浏览器中的简历、配置、问答和未登录历史记录。此操作不会删除云端账号数据。</p>
<button id="clearBtn" class="border border-red-200 text-red-600 px-5 py-2.5 rounded-xl">清除本地数据</button><p id="msg" class="text-sm text-green-600 mt-3"></p>
</div></main><script>document.getElementById('clearBtn').onclick=()=>{if(!confirm('确定清除当前浏览器中的 AI面镜 本地数据吗？'))return;['resumeInfo','jdInfo','interviewConfig','qaRecords','interviewMeta','currentInterviewReport','interviewHistory','videoUrl','videoPath','viewHistoryReport','ragProfile','onlineResume','resumeVersions','activeResumeId','interviewSeries'].forEach(k=>localStorage.removeItem(k));Object.keys(localStorage).filter(k=>/^aimianjing:.*:knowledgeItems$/.test(k)).forEach(k=>localStorage.removeItem(k));document.getElementById('msg').textContent='本地数据已清除。';};</script></body></html>
