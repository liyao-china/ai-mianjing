<h1 class="text-3xl font-bold mt-6 mb-6">隐私政策</h1>
<div class="bg-white rounded-2xl p-7 space-y-5 leading-7">
<p>AI面镜会处理你主动提交的简历、岗位描述、面试回答、设备权限选择和评分报告，用于生成面试题、完成评分与展示成长记录。</p>
<p>未登录用户的数据主要保存在当前浏览器；当你开始面试或生成报告时，相关文本会发送至第三方 AI 服务处理。登录用户的历史记录及你主动录制的视频可能保存至云端服务。</p>
<p>请勿提交身份证号、银行卡号、账号密码等不必要的敏感信息。你可以清除浏览器站点数据来删除本地记录；云端记录删除能力仍在完善中。</p>
<p>本页面为产品初版说明，上线正式商业服务前，应由专业人士审核并补充第三方服务商、保存期限、删除方式和联系方式。</p>
