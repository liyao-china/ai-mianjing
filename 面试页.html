<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>模拟面试中 - AI面镜</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: { indigo: { DEFAULT: '#6366F1' }, brandgreen: '#10B981', brandorange: '#F59E0B' },
      fontFamily: { sans: ['Inter','PingFang SC','Microsoft YaHei','sans-serif'] },
      boxShadow: { soft:'0 4px 20px rgba(99,102,241,0.08)', softlg:'0 10px 40px rgba(99,102,241,0.15)' },
    }}};
  </script>
  <style>
    body { background: #F9FAFB; color: #111827; }
    .gradient-btn { background: linear-gradient(135deg,#6366F1 0%,#8B5CF6 100%); transition: all .25s ease; }
    .gradient-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(99,102,241,0.4); }
    .gradient-btn:disabled { opacity:.5; cursor:not-allowed; transform:none; box-shadow:none; }
    .gradient-text { background: linear-gradient(135deg,#6366F1 0%,#8B5CF6 100%); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
    @keyframes pulseRing { 0%{transform:scale(1);opacity:.6} 100%{transform:scale(2);opacity:0} }
    .pulse-ring { animation: pulseRing 1.8s ease-out infinite; }
    .pulse-ring2 { animation: pulseRing 1.8s ease-out infinite; animation-delay:.6s; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
    .fade-up { animation: fadeUp .4s ease forwards; }
    @keyframes dots { 0%,20%{content:'.'} 40%{content:'..'} 60%,100%{content:'...'} }
    .typing::after { content:'.'; animation: dots 1.2s infinite; }
    .chat-scroll::-webkit-scrollbar { width:6px; }
    .chat-scroll::-webkit-scrollbar-thumb { background:#E5E7EB; border-radius:3px; }
    @keyframes recDot { 0%,100%{opacity:1} 50%{opacity:.3} }
    .rec-dot { animation: recDot 1.2s infinite; }
    #videoPanel { resize:both; overflow:hidden; min-width:220px; min-height:190px; max-width:46vw; max-height:62vh; }
    #videoPanel video { width:100%; height:calc(100% - 38px); min-height:150px; }
    .video-active main { padding-left:300px; }
    @media (max-width: 1100px) { .video-active main { padding-left:0; } #videoPanel { max-width:72vw; max-height:45vh; top:78px; } }
  </style>
</head>
<body class="font-sans antialiased h-screen flex flex-col overflow-hidden">

  <!-- 顶部状态条 -->
  <header class="bg-white border-b border-gray-100 flex-shrink-0">
    <div class="max-w-4xl mx-auto px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg gradient-btn flex items-center justify-center text-white text-sm">🪞</div>
        <span id="configLabel" class="text-sm font-medium text-gray-600">AI面试中</span>
        <span id="recBadge" class="hidden items-center gap-1 text-xs text-red-500"><span class="w-2 h-2 rounded-full bg-red-500 rec-dot"></span>录制中</span>
      </div>
      <div class="flex items-center gap-4">
        <div class="flex items-center gap-1.5 text-sm"><span>⏱️</span><span id="timer" class="font-semibold tabular-nums">30:00</span></div>
        <button id="endBtn" class="text-sm text-brandorange hover:bg-orange-50 px-3 py-1.5 rounded-lg transition">提前结束</button>
      </div>
    </div>
    <div class="max-w-4xl mx-auto px-6 pb-3">
      <div class="flex items-center justify-between mb-1.5">
        <span class="text-xs text-gray-400">问题 <span id="qNow">0</span> / <span id="qTotal">6</span></span>
        <span id="progressTip" class="text-xs text-gray-400">准备中</span>
      </div>
      <div class="flex gap-1.5" id="progressDots"></div>
    </div>
  </header>

  <!-- 对话区 -->
  <main class="flex-1 overflow-y-auto chat-scroll">
    <div class="max-w-4xl mx-auto px-6 py-8 space-y-5" id="chatArea"></div>
  </main>

  <!-- 用户视频窗：左上显示，可拖动右下角缩放 -->
  <aside id="videoPanel" class="hidden fixed top-28 left-4 bg-white rounded-2xl shadow-softlg z-30 border border-gray-200" style="width:280px;height:250px;">
    <div class="h-[38px] px-3 flex items-center justify-between border-b border-gray-100 bg-white">
      <span class="text-xs font-medium text-gray-600">我的视频 · 拖动右下角缩放</span>
      <div class="flex gap-1">
        <button data-video-size="small" class="text-xs text-gray-400 hover:text-indigo px-1">小</button>
        <button data-video-size="large" class="text-xs text-gray-400 hover:text-indigo px-1">大</button>
      </div>
    </div>
    <video id="selfVideo" autoplay muted playsinline class="object-cover rounded-b-2xl bg-gray-900"></video>
  </aside>

  <!-- 底部交互区 -->
  <footer class="bg-white border-t border-gray-100 flex-shrink-0">
    <div class="max-w-4xl mx-auto px-6 py-5">
      <div id="voiceMode" class="flex flex-col items-center">
        <div class="relative mb-3">
          <div class="absolute inset-0 rounded-full bg-indigo/30 pulse-ring hidden" id="ring1"></div>
          <div class="absolute inset-0 rounded-full bg-indigo/30 pulse-ring2 hidden" id="ring2"></div>
          <button id="recordBtn" class="w-20 h-20 rounded-full gradient-btn flex items-center justify-center text-white text-3xl relative z-10 shadow-softlg">🎙️</button>
        </div>
        <canvas id="waveCanvas" width="200" height="32" class="hidden mb-2"></canvas>
        <p id="recordHint" class="text-sm text-gray-500 mb-1">点击麦克风开始回答，停止后自动发送</p>
        <p id="liveTranscript" class="text-xs text-gray-400 max-w-xl text-center min-h-[20px]">实时转录会显示在对话区，无需手动提交</p>
      </div>
      <div id="textMode" class="hidden">
        <textarea id="textInput" rows="3" placeholder="在这里输入你的回答..." class="w-full border-2 border-gray-200 rounded-xl p-4 text-sm focus:border-indigo focus:outline-none resize-none"></textarea>
      </div>
      <div class="flex items-center justify-center gap-3 mt-4">
        <button id="switchModeBtn" class="text-sm text-gray-500 hover:text-indigo px-4 py-2 rounded-lg border border-gray-200 hover:border-indigo transition">⌨️ 切换文字</button>
        <button id="nextBtn" class="gradient-btn text-white text-sm font-medium px-6 py-2 rounded-lg hidden">✓ 提交回答</button>
      </div>
    </div>
  </footer>

  <!-- 视频录制授权弹窗 -->
  <div id="videoModal" class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50">
    <div class="bg-white rounded-2xl p-7 max-w-md mx-4 text-center">
      <div class="text-4xl mb-3">📹</div>
      <h3 id="videoModalTitle" class="text-xl font-bold mb-2">视频录制授权</h3>
      <p id="videoModalDesc" class="text-gray-500 text-sm mb-2">为了帮助你<b>赛后复盘</b>，本次面试可全程录制视频（含画面和声音）。</p>
      <p id="videoModalNote" class="text-gray-400 text-xs mb-6">测试版录制会上传云端用于历史回放，请勿录制敏感内容。你也可以选择不录制。</p>
      <div class="flex gap-3">
        <button id="noRecordBtn" class="flex-1 py-2.5 rounded-xl border-2 border-gray-200 text-sm font-medium hover:border-gray-300 transition">不录制</button>
        <button id="agreeRecordBtn" class="flex-1 py-2.5 rounded-xl gradient-btn text-white text-sm font-medium">同意录制</button>
      </div>
      <p id="videoError" class="text-xs text-brandorange mt-3 hidden"></p>
    </div>
  </div>

  <!-- 提前结束确认弹窗 -->
  <div id="interruptModal" class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50">
    <div class="bg-white rounded-2xl p-7 max-w-sm mx-4 text-center">
      <div class="text-4xl mb-3">⏸️</div>
      <h3 class="text-xl font-bold mb-2">要提前结束本次面试吗？</h3>
      <p class="text-gray-500 text-sm mb-6">已完成的回答会被保留，并基于当前进度生成报告。</p>
      <div class="flex gap-3">
        <button id="continueInterview" class="flex-1 py-2.5 rounded-xl border-2 border-gray-200 text-sm font-medium">继续面试</button>
        <button id="confirmInterrupt" class="flex-1 py-2.5 rounded-xl bg-brandorange text-white text-sm font-medium">提前结束</button>
      </div>
    </div>
  </div>

  <!-- 结束弹窗 -->
  <div id="endModal" class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50">
    <div class="bg-white rounded-2xl p-7 max-w-sm mx-4 text-center">
      <div class="text-4xl mb-3">🎉</div>
      <h3 class="text-xl font-bold mb-2">面试完成！</h3>
      <p class="text-gray-500 text-sm mb-6" id="endMsg">AI 正在分析你的表现，即将生成评分报告...</p>
      <button id="goReport" class="w-full py-2.5 rounded-xl gradient-btn text-white text-sm font-medium">查看报告 →</button>
    </div>
  </div>

  <script>
    /* ============ 填你的 Key ============ */
    const API_KEY = "sk-ebd50b34fb01401da5d5e02caddfa24e";
    const MODEL = "qwen3.7-plus";
    const API_URL = "https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions";
    const SUPABASE_URL = "https://skxpfgqylfpavoiurfhr.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNreHBmZ3F5bGZwYXZvaXVyZmhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0NjE5NTYsImV4cCI6MjA5NjAzNzk1Nn0._UcR6vWOppvwcqYaHFqIlKJrADRaRZDOpBDLIdPXncY";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const VIDEO_BUCKET = "interview-videos";
    /* ================================== */

    const jobNames = { 'ai-pm':'AI产品经理','ai-ops':'AI运营','agent':'Agent开发工程师','algo':'算法工程师','frontend':'前端开发','backend':'后端开发' };
    const levelNames = { intern:'实习', campus:'校招', junior:'初级', mid:'中级', senior:'高级', expert:'专家' };
    const typeNames = { behavior:'行为面试', tech:'技术面试', project:'项目深度面', pressure:'压力面试', case:'案例设计面' };
    const inputNames = { voice:'语音回答', video:'视频回答', text:'文字回答' };
    const durMap = { quick:{sec:900,total:5}, standard:{sec:1800,total:8}, deep:{sec:3600,total:12} };

    let cfg={}; try { cfg = JSON.parse(localStorage.getItem('interviewConfig')) || {}; } catch(e){}
    let resumeInfo=''; try { resumeInfo = localStorage.getItem('resumeInfo') || ''; } catch(e){}
    let jdInfo=''; try { jdInfo = localStorage.getItem('jdInfo') || ''; } catch(e){}

    const jobName = jobNames[cfg.job] || 'AI产品经理';
    const levelName = levelNames[cfg.level] || '中级';
    const typeList = (cfg.type && cfg.type.length) ? cfg.type.map(t=>typeNames[t]).join('、') : '综合面试';
    const dur = durMap[cfg.duration] || durMap.standard;
    const TOTAL_QUESTIONS = dur.total;

    document.getElementById('configLabel').textContent = `${jobName} · ${levelName} · ${typeList} · ${inputNames[cfg.input] || inputNames.video}`;
    document.getElementById('qTotal').textContent = TOTAL_QUESTIONS;

    let state = {
      inputMode: cfg.input || 'video',
      questionCount:0, messages:[], qaRecords:[], lastQuestion:'',
      waitingAnswer:false, isRecording:false, totalSeconds:dur.sec, timerId:null,
      aiThinking:false,
      mediaStream:null, recognition:null, transcript:'', liveTranscript:'',
      videoStream:null, videoRecorder:null, videoChunks:[], recordVideo:false
    };

    /* ===== 人才模型 + systemPrompt ===== */
    const talentModels = {
      'ai-pm': `① 技术理解力 ② 产品落地力 ③ 业务洞察力 ④ 数据驱动力 ⑤ 协作推动力`,
      'agent': `① 框架掌握度 ② 架构设计力 ③ 工程实现力 ④ 问题解决力 ⑤ 技术视野`,
      'algo': `① 算法基础 ② 工程落地 ③ 业务结合 ④ 项目深度 ⑤ 技术前沿`,
      'default': `① 基础知识 ② 工程能力 ③ 问题解决 ④ 项目深度 ⑤ 学习成长`
    };
    const talentModel = talentModels[cfg.job] || talentModels['default'];

    const systemPrompt = `你是一位经验丰富、洞察敏锐的资深面试官，正在面试应聘【${jobName}】（${levelName}级别）的候选人。本次面试类型：${typeList}。
${resumeInfo ? '【候选人简历/背景】\n' + resumeInfo + '\n' : ''}
${jdInfo ? '【目标岗位JD】\n' + jdInfo + '\n' : ''}
【人才画像评估模型（你心中的考察框架）】
系统性评估候选人在以下维度：${talentModel}
有意识把每个维度考察到位，没测清楚的就设计问题考察。
【递进式提问】对一个考察点：先整体→再理解→深挖细节→挑战边界→必要时反思。某维度清楚后切换下一维度。
【面试风格】像真实的优秀面试官一样专业、友好、有交流感。每次只问一个问题，使用自然过渡，根据上一轮回答灵活追问；避免模板化、机械化句式，也不要每轮都重复“好的”“感谢”。
${jdInfo ? '重点对照JD要求考察。' : ''}
【第一题规则】第一道题固定邀请候选人做1-2分钟自我介绍，并提示结合目标岗位重点展开。第一题之后再根据回答递进追问。
【严格保密】你的评估框架和考察意图绝不能说出来。禁止说"我想考察xx""这道题评估xx"。只自然地问问题，分析默默记心里。
【流程控制】每次回复最后一行单独输出状态标记（用户看不到）：
- 继续提问：[STATUS:CONTINUE]
- 已较全面评估，进入反问环节：先说"我的问题差不多了，你有什么想问我的吗？"再输出 [STATUS:REVERSE]
- 反问结束：说几句结束语再输出 [STATUS:END]
本次面试最多提问${TOTAL_QUESTIONS}道题。不要超过题目上限。
第一道自我介绍由系统直接发出。收到候选人的自我介绍后，再开始你的递进提问。`;

    state.messages.push({ role:'system', content: systemPrompt });

    // 进度点
    const dotsBox = document.getElementById('progressDots');
    for(let i=0;i<TOTAL_QUESTIONS;i++){ const d=document.createElement('div'); d.className='flex-1 h-1.5 rounded-full bg-gray-200 transition-all'; dotsBox.appendChild(d); }
    function updateDots(){
      [...dotsBox.children].forEach((d,i)=> d.className='flex-1 h-1.5 rounded-full transition-all '+(i<state.questionCount?'bg-brandgreen':i===state.questionCount?'bg-indigo':'bg-gray-200'));
      document.getElementById('qNow').textContent = Math.min(state.questionCount, TOTAL_QUESTIONS);
    }

    // 气泡
    function escapeHtml(value){
      return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    const chatArea = document.getElementById('chatArea');
    function addAIBubble(text){
      const div=document.createElement('div'); div.className='flex gap-3 fade-up';
      div.innerHTML=`<div class="w-9 h-9 rounded-full bg-indigo/10 flex items-center justify-center text-base flex-shrink-0">🤖</div><div class="max-w-[80%]"><div class="bg-indigo/5 rounded-2xl rounded-tl-sm px-5 py-3.5 text-sm text-gray-700 leading-relaxed">${escapeHtml(text)}</div></div>`;
      chatArea.appendChild(div); scrollBottom();
    }
    function addUserBubble(text){
      const div=document.createElement('div'); div.className='flex gap-3 justify-end fade-up';
      div.innerHTML=`<div class="max-w-[80%]"><div class="bg-white border border-gray-200 rounded-2xl rounded-tr-sm px-5 py-3.5 text-sm text-gray-700 leading-relaxed">${escapeHtml(text)}</div></div><div class="w-9 h-9 rounded-full bg-indigo flex items-center justify-center text-white text-sm flex-shrink-0">我</div>`;
      chatArea.appendChild(div); scrollBottom();
    }
    function updateLiveUserBubble(text){
      let div=document.getElementById('liveUserBubble');
      if(!div){
        div=document.createElement('div'); div.id='liveUserBubble'; div.className='flex gap-3 justify-end fade-up';
        div.innerHTML=`<div class="max-w-[80%]"><div class="bg-indigo/5 border-2 border-indigo/20 rounded-2xl rounded-tr-sm px-5 py-3.5"><div class="text-xs text-indigo mb-1 flex items-center gap-1"><span class="w-1.5 h-1.5 rounded-full bg-red-500 rec-dot"></span>正在实时转录</div><div class="text-sm text-gray-700 leading-relaxed" data-live-text>请开始回答…</div></div></div><div class="w-9 h-9 rounded-full bg-indigo flex items-center justify-center text-white text-sm flex-shrink-0">我</div>`;
        chatArea.appendChild(div);
      }
      div.querySelector('[data-live-text]').textContent=text||'请开始回答…'; scrollBottom();
    }
    function removeLiveUserBubble(){ document.getElementById('liveUserBubble')?.remove(); }
    function addThinking(){
      const div=document.createElement('div'); div.id='thinkingBubble'; div.className='flex gap-3 fade-up';
      div.innerHTML=`<div class="w-9 h-9 rounded-full bg-indigo/10 flex items-center justify-center text-base flex-shrink-0">🤖</div><div class="bg-indigo/5 rounded-2xl rounded-tl-sm px-5 py-3.5 text-sm text-gray-400"><span class="typing">面试官思考中</span></div>`;
      chatArea.appendChild(div); scrollBottom();
    }
    function removeThinking(){ const t=document.getElementById('thinkingBubble'); if(t) t.remove(); }
    function scrollBottom(){ const m=document.querySelector('main'); setTimeout(()=>m.scrollTop=m.scrollHeight,50); }

    // ===== AI 语音播报 (TTS) =====
    let preferredVoice=null;
    function selectPreferredVoice(){
      const voices=window.speechSynthesis?.getVoices?.()||[];
      preferredVoice=voices.find(v=>/Xiaoxiao|晓晓|Ting-Ting|Google 普通话|Meijia/i.test(v.name))
        || voices.find(v=>/^zh[-_](CN|Hans)/i.test(v.lang))
        || voices.find(v=>/^zh/i.test(v.lang))
        || null;
    }
    if('speechSynthesis' in window){ selectPreferredVoice(); window.speechSynthesis.onvoiceschanged=selectPreferredVoice; }
    function speak(text){
      if(!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'zh-CN'; u.rate = .94; u.pitch = 1.03; if(preferredVoice) u.voice=preferredVoice;
      window.speechSynthesis.speak(u);
    }

    async function callAI(messages){
      const response = await fetch(API_URL, { method:'POST',
        headers:{ 'Authorization':'Bearer '+API_KEY, 'Content-Type':'application/json' },
        body: JSON.stringify({ model: MODEL, enable_thinking:false, messages }) });
      const data = await response.json();
      if(data.error) throw new Error(JSON.stringify(data.error));
      return data.choices[0].message.content.trim();
    }

    let interviewPhase = 'interviewing';
    function deliverFirstQuestion(){
      const question=`你好，欢迎参加本次${jobName}模拟面试。我们先从自我介绍开始：请你用 1-2 分钟介绍一下自己，并重点说说与这个岗位最相关的经历和优势。`;
      addAIBubble(question); speak(question);
      state.lastQuestion=question;
      state.messages.push({role:'assistant',content:question+'\n[STATUS:CONTINUE]'});
      state.questionCount=1; state.waitingAnswer=true; updateDots(); setInputEnabled(true);
      document.getElementById('progressTip').textContent='请先完成自我介绍';
      document.getElementById('recordHint').textContent='点击麦克风开始自我介绍，停止后自动发送';
    }
    async function askNextQuestion(){
      if(state.qaRecords.length >= TOTAL_QUESTIONS){ finishInterview(); return; }
      state.aiThinking=true;
      document.getElementById('progressTip').textContent='AI 思考中，通常需要 5-15 秒';
      setInputEnabled(false); addThinking();
      try{
        let reply = await callAI(state.messages);
        let status='CONTINUE'; const match=reply.match(/\[STATUS:(\w+)\]/); if(match) status=match[1];
        const question = reply.replace(/\[STATUS:\w+\]/g,'').trim();
        removeThinking(); addAIBubble(question); speak(question); // 语音播报
        state.lastQuestion=question; state.messages.push({role:'assistant',content:reply});
        state.aiThinking=false;
        if(status==='END'){ state.waitingAnswer=false; setInputEnabled(false); document.getElementById('progressTip').textContent='面试结束'; setTimeout(()=>finishInterview(),1200); return; }
        if(status==='REVERSE'){ interviewPhase='reversing'; document.getElementById('progressTip').textContent='反问环节'; }
        else { state.questionCount++; updateDots(); document.getElementById('progressTip').textContent='请回答'; }
        state.waitingAnswer=true; setInputEnabled(true);
        if(state.inputMode==='voice' || state.inputMode==='video') document.getElementById('recordHint').textContent='点击麦克风开始回答，停止后自动发送';
      }catch(err){
        state.aiThinking=false;
        removeThinking();
        addAIBubble('出题暂时失败，请稍后重试或结束本次面试。');
        document.getElementById('progressTip').textContent='出题失败';
      }
    }

    async function submitAnswer(answerText){
      if(!answerText || !answerText.trim()){ alert('回答内容为空'); return; }
      removeLiveUserBubble();
      addUserBubble(answerText);
      state.messages.push({role:'user',content:answerText});
      state.qaRecords.push({question:state.lastQuestion,answer:answerText});
      state.waitingAnswer=false;
      document.getElementById('nextBtn').classList.add('hidden');
      document.getElementById('textInput').value=''; document.getElementById('liveTranscript').textContent='实时转录会显示在对话区，无需手动提交';
      if(state.qaRecords.length >= TOTAL_QUESTIONS){
        document.getElementById('progressTip').textContent='已完成全部题目';
        setInputEnabled(false);
        setTimeout(()=>finishInterview(),500);
      } else {
        askNextQuestion();
      }
    }

    function setInputEnabled(enabled){
      document.getElementById('recordBtn').disabled=!enabled;
      document.getElementById('switchModeBtn').disabled=!enabled;
      const txt=document.getElementById('textInput'); if(txt) txt.disabled=!enabled;
      if(state.inputMode==='text'){ document.getElementById('nextBtn').classList.toggle('hidden',!enabled); if(enabled) document.getElementById('nextBtn').textContent='✓ 提交回答'; }
    }

    document.getElementById('nextBtn').addEventListener('click',()=>{
      if(state.inputMode==='text'){ const txt=document.getElementById('textInput').value.trim(); if(!txt){alert('请先输入回答');return;} submitAnswer(txt); }
      else { if(state.isRecording) stopRecording(); }
    });

    document.getElementById('switchModeBtn').addEventListener('click',()=>{
      state.inputMode=state.inputMode==='text'?(cfg.input==='video'?'video':'voice'):'text';
      const btn=document.getElementById('switchModeBtn');
      if(state.inputMode==='text'){ document.getElementById('voiceMode').classList.add('hidden'); document.getElementById('textMode').classList.remove('hidden'); btn.textContent='🎙️ 切换语音'; if(state.waitingAnswer){ document.getElementById('nextBtn').classList.remove('hidden'); document.getElementById('nextBtn').textContent='✓ 提交回答'; } }
      else { document.getElementById('voiceMode').classList.remove('hidden'); document.getElementById('textMode').classList.add('hidden'); btn.textContent='⌨️ 切换文字'; document.getElementById('nextBtn').classList.add('hidden'); }
    });

    /* ===== 麦克风音量分析 + 语音识别 ===== */
    let audioCtx, analyser, dataArray, waveAnimId;
    function setupAnalyser(stream){
      audioCtx=new (window.AudioContext||window.webkitAudioContext)();
      const src=audioCtx.createMediaStreamSource(stream);
      analyser=audioCtx.createAnalyser(); analyser.fftSize=64;
      src.connect(analyser); dataArray=new Uint8Array(analyser.frequencyBinCount);
    }
    function drawWave(){
      const canvas=document.getElementById('waveCanvas'),ctx=canvas.getContext('2d');
      function loop(){ waveAnimId=requestAnimationFrame(loop); analyser.getByteFrequencyData(dataArray);
        ctx.clearRect(0,0,canvas.width,canvas.height); const bars=20,gap=2,bw=(canvas.width-(bars-1)*gap)/bars;
        for(let i=0;i<bars;i++){ const v=dataArray[i]||0,h=Math.max(3,(v/255)*canvas.height); ctx.fillStyle='#6366F1'; ctx.fillRect(i*(bw+gap),(canvas.height-h)/2,bw,h); } }
      loop();
    }
    function setupRecognition(){
      const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR) return;
      state.recognition=new SR(); state.recognition.lang='zh-CN'; state.recognition.continuous=true; state.recognition.interimResults=true;
      state.recognition.onresult=(e)=>{ let final='',interim=''; for(let i=e.resultIndex;i<e.results.length;i++){ const t=e.results[i][0].transcript; if(e.results[i].isFinal) final+=t; else interim+=t; } if(final) state.transcript+=final; state.liveTranscript=state.transcript+interim; updateLiveUserBubble(state.liveTranscript); };
    }
    function startRecording(){
      if(!state.mediaStream || !state.waitingAnswer) return;
      window.speechSynthesis.cancel(); // 用户开始说话，停掉AI语音
      state.isRecording=true; state.transcript=''; state.liveTranscript=''; updateLiveUserBubble('');
      document.getElementById('liveTranscript').textContent='转录中，点击停止后会自动发送';
      if(state.recognition){ try{state.recognition.start();}catch(e){} }
      document.getElementById('recordBtn').textContent='⏹️';
      document.getElementById('ring1').classList.remove('hidden'); document.getElementById('ring2').classList.remove('hidden');
      document.getElementById('waveCanvas').classList.remove('hidden');
      document.getElementById('recordHint').textContent='正在回答，再次点击停止并自动发送';
      if(audioCtx&&audioCtx.state==='suspended') audioCtx.resume();
      drawWave();
    }
    function stopRecording(){
      if(!state.isRecording) return; state.isRecording=false;
      if(state.recognition){ try{state.recognition.stop();}catch(e){} }
      cancelAnimationFrame(waveAnimId);
      document.getElementById('recordBtn').textContent='🎙️';
      document.getElementById('ring1').classList.add('hidden'); document.getElementById('ring2').classList.add('hidden');
      document.getElementById('waveCanvas').classList.add('hidden');
      const answer=(state.liveTranscript||state.transcript).trim();
      if(!answer){ removeLiveUserBubble(); document.getElementById('recordHint').textContent='没听清，请重新点击麦克风回答'; return; }
      setTimeout(()=> submitAnswer(answer),300);
    }
    document.getElementById('recordBtn').addEventListener('click',()=>{ if(!state.waitingAnswer) return; state.isRecording?stopRecording():startRecording(); });

    /* ===== 计时 ===== */
    function fmt(s){ const m=Math.floor(s/60),ss=s%60; return `${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}`; }
    function startTimer(){
      document.getElementById('timer').textContent=fmt(state.totalSeconds);
      state.timerId=setInterval(()=>{ if(!state.waitingAnswer || state.aiThinking) return; state.totalSeconds--; const t=document.getElementById('timer'); t.textContent=fmt(state.totalSeconds);
        if(state.totalSeconds<=60) t.classList.add('text-brandorange'); if(state.totalSeconds<=0){ clearInterval(state.timerId); finishInterview(); } },1000);
    }

    /* ===== 结束面试 + 上传视频 ===== */
    document.getElementById('endBtn').addEventListener('click',()=>{ const m=document.getElementById('interruptModal'); m.classList.remove('hidden'); m.classList.add('flex'); });
    document.getElementById('continueInterview').addEventListener('click',()=>{ const m=document.getElementById('interruptModal'); m.classList.add('hidden'); m.classList.remove('flex'); });
    document.getElementById('confirmInterrupt').addEventListener('click',()=>{
      const m=document.getElementById('interruptModal'); m.classList.add('hidden'); m.classList.remove('flex');
      finishInterview(true);
    });
    document.getElementById('goReport').addEventListener('click',()=>{ window.location.href='报告页.html'; });

    let finished = false;
    async function finishInterview(early=false){
      if(finished) return; finished=true;
      clearInterval(state.timerId);
      window.speechSynthesis.cancel();
      removeLiveUserBubble();

      // 保存问答记录
      localStorage.setItem('qaRecords', JSON.stringify(state.qaRecords));
      localStorage.setItem('interviewMeta', JSON.stringify({ jobName, levelName, typeList }));
      localStorage.removeItem('currentInterviewReport');

      const m=document.getElementById('endModal'); m.classList.remove('hidden'); m.classList.add('flex');

      // 停止视频录制并上传
      if(state.recordVideo && state.videoRecorder){
        document.getElementById('endMsg').textContent = '正在保存面试视频，请稍候...';
        document.getElementById('goReport').disabled = true;
        await stopAndUploadVideo();
        document.getElementById('goReport').disabled = false;
      }
      document.getElementById('endMsg').textContent = early ? '已提前结束，AI 将根据当前已完成回答生成报告。' : 'AI 即将为你生成评分报告';

      // 停掉麦克风
      if(state.mediaStream) state.mediaStream.getTracks().forEach(t=>t.stop());
      if(state.videoStream) state.videoStream.getTracks().forEach(t=>t.stop());
    }

    async function stopAndUploadVideo(){
      return new Promise((resolve)=>{
        state.videoRecorder.onstop = async () => {
          try {
            const contentType=state.videoRecorder.mimeType || 'video/webm';
            const blob = new Blob(state.videoChunks, { type:contentType });
            const { data:{ user } } = await sb.auth.getUser();
            if(!user){ console.warn('未登录，视频不上传'); resolve(); return; }
            const extension=contentType.includes('mp4')?'mp4':'webm';
            const fileName = `${user.id}/${Date.now()}.${extension}`;
            const { error } = await sb.storage.from(VIDEO_BUCKET).upload(fileName, blob, { contentType });
            if(error){ console.warn('视频上传失败', error); resolve(); return; }
            // 拿到公开URL（public桶）
            const { data } = sb.storage.from(VIDEO_BUCKET).getPublicUrl(fileName);
            localStorage.setItem('videoUrl', data.publicUrl);
            console.log('✅ 视频已上传:', data.publicUrl);
            resolve();
          } catch(e){ console.warn('上传异常', e); resolve(); }
        };
        state.videoRecorder.stop();
      });
    }

    /* ===== 视频授权弹窗 ===== */
    document.getElementById('agreeRecordBtn').addEventListener('click', async ()=>{
      const errorEl=document.getElementById('videoError');
      errorEl.classList.add('hidden');
      document.getElementById('agreeRecordBtn').disabled=true;
      try {
        // 同时请求摄像头+麦克风
        try{
          state.videoStream = await navigator.mediaDevices.getUserMedia({ video:{facingMode:'user'}, audio:true });
        }catch(error){
          if(error?.name==='OverconstrainedError'){
            state.videoStream = await navigator.mediaDevices.getUserMedia({ video:true, audio:true });
          }else{
            throw error;
          }
        }
        // 显示自己画面
        const sv = document.getElementById('selfVideo');
        sv.srcObject = state.videoStream;
        document.getElementById('videoPanel').classList.remove('hidden');
        document.body.classList.add('video-active');
        // 浏览器支持时录制视频；不支持录制时仍可进行视频回答
        if('MediaRecorder' in window){
          state.videoChunks = [];
          const mimeType=getSupportedMime();
          state.videoRecorder = mimeType ? new MediaRecorder(state.videoStream, { mimeType }) : new MediaRecorder(state.videoStream);
          state.videoRecorder.ondataavailable = e=>{ if(e.data.size>0) state.videoChunks.push(e.data); };
          state.videoRecorder.start();
          state.recordVideo = true;
          document.getElementById('recBadge').classList.remove('hidden');
          document.getElementById('recBadge').classList.add('flex');
        }else{
          state.recordVideo = false;
          document.getElementById('recordHint').textContent='当前浏览器不支持录像保存，但可以继续视频回答';
        }
        // 用同一个流的音频做语音识别
        state.mediaStream = state.videoStream;
        setupAnalyser(state.videoStream); setupRecognition();
        if(cfg.input==='video') document.getElementById('recordHint').textContent='视频已开启，点击麦克风开始回答，停止后自动发送';
        localStorage.removeItem('videoUrl');
        closeVideoModal(); startFlow();
      } catch(err){
        errorEl.classList.remove('hidden');
        errorEl.textContent=mediaErrorMessage(err);
      } finally {
        document.getElementById('agreeRecordBtn').disabled=false;
      }
    });

    document.getElementById('noRecordBtn').addEventListener('click', async ()=>{
      state.recordVideo = false;
      localStorage.removeItem('videoUrl');
      if(cfg.input==='video') state.inputMode='voice';
      // 仍然请求麦克风(语音答题用)
      if(state.inputMode==='voice' || state.inputMode==='video'){
        try {
          state.mediaStream = await navigator.mediaDevices.getUserMedia({ audio:true });
          setupAnalyser(state.mediaStream); setupRecognition();
        } catch(err){
          state.inputMode='text';
          document.getElementById('switchModeBtn').textContent='🎙️ 切换语音';
          document.getElementById('recordHint').textContent='麦克风无法使用，已自动切换为文字回答';
        }
      }
      closeVideoModal(); startFlow();
    });

    function getSupportedMime(){
      const types=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm','video/mp4'];
      for(const t of types){ if(MediaRecorder.isTypeSupported(t)) return t; }
      return '';
    }
    function closeVideoModal(){ document.getElementById('videoModal').classList.add('hidden'); }
    document.querySelectorAll('[data-video-size]').forEach(btn=>btn.addEventListener('click',()=>{
      const panel=document.getElementById('videoPanel');
      if(btn.dataset.videoSize==='small'){panel.style.width='240px';panel.style.height='210px';}
      else{panel.style.width='380px';panel.style.height='330px';}
    }));

    function mediaErrorMessage(error){
      const messages={
        NotAllowedError:'摄像头或麦克风权限被浏览器或系统拒绝，请在站点设置和系统隐私设置中允许访问。',
        SecurityError:'当前页面无法安全访问摄像头或麦克风，请使用 HTTPS 页面并避免在受限内置浏览器中打开。',
        NotFoundError:'没有检测到可用的摄像头或麦克风，请连接设备后重试。',
        DevicesNotFoundError:'没有检测到可用的摄像头或麦克风，请连接设备后重试。',
        NotReadableError:'设备已授权但无法读取，可能正被微信、会议软件或其他浏览器占用。',
        TrackStartError:'设备已授权但无法启动，请关闭其他正在使用摄像头或麦克风的应用。',
        OverconstrainedError:'当前设备不支持请求的视频参数，请更换设备或改用语音回答。',
        AbortError:'设备启动被中断，请刷新页面后重试。'
      };
      return messages[error?.name] || `无法访问摄像头或麦克风：${error?.message || '未知错误'}。`;
    }

    if(cfg.input==='video'){
      document.getElementById('videoModalTitle').textContent='开启视频回答';
      document.getElementById('videoModalDesc').innerHTML='视频回答需要访问你的<b>摄像头和麦克风</b>，面试过程中会显示本人画面并使用语音作答。';
      document.getElementById('videoModalNote').textContent='登录用户可在历史记录中回放录制内容。请勿录制敏感信息。';
      document.getElementById('noRecordBtn').textContent='改用语音回答';
      document.getElementById('agreeRecordBtn').textContent='开启视频并开始';
      document.getElementById('videoModal').classList.remove('hidden');
      document.getElementById('videoModal').classList.add('flex');
    }

    /* ===== 启动 ===== */
    function startFlow(){
      if(state.inputMode==='text'){ document.getElementById('voiceMode').classList.add('hidden'); document.getElementById('textMode').classList.remove('hidden'); }
      startTimer();
      deliverFirstQuestion();
    }
    async function startWithoutVideo(){
      if(state.inputMode==='voice'){
        try{
          state.mediaStream=await navigator.mediaDevices.getUserMedia({audio:true});
          setupAnalyser(state.mediaStream); setupRecognition();
        }catch(err){
          state.inputMode='text';
          document.getElementById('recordHint').textContent='麦克风无法使用，已自动切换为文字回答';
        }
      }
      startFlow();
    }
    if(cfg.input!=='video') startWithoutVideo();
  </script>
</body>
</html>
